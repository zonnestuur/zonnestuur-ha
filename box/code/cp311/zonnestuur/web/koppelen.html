<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0d151d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Zonnestuur apparaten</title>
<style>
/* In een app-webweergave: doorslepen bovenaan mag niet doorgaan naar 'trek omlaag om te verversen' van de app. */
html, body { overscroll-behavior-y: none; }

  @font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Inter Tight"; src: url("fonts/inter-tight.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: light;
    --bg: #e8ecef; --card: rgba(255,255,255,.82); --card-solid: #fff; --line: rgba(14,17,22,.08);
    --shadow: 0 1px 2px rgba(14,17,22,.04), 0 8px 28px -12px rgba(14,17,22,.12);
    --ink: #0e1116; --ink-2: #5c6470; --ink-3: #8a919b; --field: #fff;
    --sun: #e08600; --sun-ink: #9a5b00; --sun-soft: rgba(255,178,36,.16); --net: #2f5bdb;
    --good: #16733e; --good-soft: rgba(31,138,76,.12); --warn: #b54708; --warn-soft: rgba(181,71,8,.10);
    --chip: rgba(14,17,22,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #080c10; --card: rgba(255,255,255,.045); --card-solid: #11151b; --line: rgba(255,255,255,.09);
      --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -30px rgba(0,0,0,.8);
      --ink: #f2f4f7; --ink-2: #a3acb8; --ink-3: #6f7885; --field: rgba(255,255,255,.04);
      --sun: #ffb224; --sun-ink: #ffb224; --sun-soft: rgba(255,178,36,.14); --net: #5b8cff;
      --good: #4ade80; --good-soft: rgba(74,222,128,.12); --warn: #fdb022; --warn-soft: rgba(253,176,34,.12);
      --chip: rgba(255,255,255,.06);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #080c10; --card: rgba(255,255,255,.045); --card-solid: #11151b; --line: rgba(255,255,255,.09);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -30px rgba(0,0,0,.8);
    --ink: #f2f4f7; --ink-2: #a3acb8; --ink-3: #6f7885; --field: rgba(255,255,255,.04);
    --sun: #ffb224; --sun-ink: #ffb224; --sun-soft: rgba(255,178,36,.14); --net: #5b8cff;
    --good: #4ade80; --good-soft: rgba(74,222,128,.12); --warn: #fdb022; --warn-soft: rgba(253,176,34,.12);
    --chip: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15.5px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .t { font-family: "Inter Tight", "Inter", system-ui, sans-serif; letter-spacing: -.02em; }
  main { max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 48px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 2px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; text-decoration: none; color: inherit; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .spacer { flex: 1; }
  .top a.link { color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600; }
  h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.1; margin: 0 0 8px; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .lead { color: var(--ink-2); margin: 0 0 18px; font-size: 16px; max-width: 62ch; }
  .muted { color: var(--ink-2); } .small { font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); margin-top: 14px; }
  .status { display: flex; gap: 10px; align-items: flex-start; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3); }
  .dot.ok { background: var(--good); } .dot.wait { background: var(--sun); } .dot.bad { background: var(--warn); }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
  input[type="checkbox"] { width: 20px; height: 20px; padding: 0; accent-color: var(--sun); }
  label { font-weight: 600; font-size: 14px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .hint { font-size: 12.5px; color: var(--ink-3); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  #cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  #cats button { flex: none; }
  .chips button { font: inherit; font-size: 13.5px; font-weight: 550; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink-2); cursor: pointer; }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn { font: inherit; font-weight: 600; font-size: 15px; border: 0; cursor: pointer; padding: 11px 20px; border-radius: 999px;
         color: #1a1204; background: linear-gradient(180deg, #ffc44d, #ff9a1a); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
  .btn.ghost { background: var(--chip); color: var(--ink); }
  .btn.small { padding: 7px 13px; font-size: 13.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--net); outline-offset: 2px; }
  .results { display: grid; gap: 10px; margin-top: 14px; }
  details.brandrow { background: var(--card-solid); border: 1px solid var(--line); border-radius: 18px; }
  details.brandrow[open] { border-color: var(--ink-3); }
  details.brandrow summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
  details.brandrow summary::-webkit-details-marker { display: none; }
  .bname { font-weight: 650; }
  .bmeta { font-size: 13px; color: var(--ink-2); grid-column: 1; overflow-wrap: anywhere; }
  .pill { font-size: 12px; font-weight: 650; padding: 5px 10px; border-radius: 999px; background: var(--chip); color: var(--ink-2); white-space: nowrap; grid-column: 2; grid-row: 1 / span 2; }
  .pill.direct { background: var(--good-soft); color: var(--good); }
  .pill.motor { background: rgba(47,91,219,.12); color: var(--net); }
  .pill.cloud { background: var(--sun-soft); color: var(--sun-ink); }
  .routes { border-top: 1px solid var(--line); padding: 4px 16px 14px; display: grid; gap: 4px; }
  .route { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .route:last-child { border-bottom: 0; }
  .route .rt { font-weight: 650; font-size: 14.5px; }
  .route .rn, .route .rs { font-size: 13.5px; color: var(--ink-2); grid-column: 1; }
  .route .rn b { color: var(--ink); } .route .rs a { color: var(--net); font-weight: 600; }
  .route .go { grid-column: 2; grid-row: 1 / span 3; }
  .tag { font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-left: 6px; }
  @media (max-width: 560px) { .route { grid-template-columns: minmax(0, 1fr); } .route .go { grid-column: 1; grid-row: auto; margin-top: 6px; } }
  .panel { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .panel .box { background: var(--card-solid); border-radius: 22px; padding: 22px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
  .panel .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .err { color: var(--warn); font-size: 14px; }
  .ok { color: var(--good); font-weight: 600; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--sun); animation: spin .8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .entries { display: grid; gap: 6px; margin-top: 8px; }
  .entry { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .entry .wat { display: block; font-size: 12.5px; color: var(--ink-2); }
  .gekop { margin-top: 10px; display: grid; gap: 12px; }
  .kgroep { display: grid; gap: 8px; }
  .kgroep > b, .kgroep > summary { font-size: 14px; }
  .tag.warn { color: #b42318; }
  .rn.storing, .tag.storing { color: #9a4a06; font-weight: 600; }
  :root[data-theme="dark"] .rn.storing, :root[data-theme="dark"] .tag.storing { color: #fbbf24; }
  .entry span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .count { font-size: 13px; color: var(--ink-3); margin-top: 12px; }
  .more { margin: 12px auto 0; display: block; }
  .ontdekt { margin: -4px -4px 14px; padding: 12px 14px; border-radius: 16px; background: var(--sun-soft, rgba(255,178,36,.14)); }
  .rijen { display: grid; gap: 2px; }
  .rij { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .rij:first-child { border-top: 0; }
  .rij .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--ink-2); }
  .rij .ic svg { width: 19px; height: 19px; }
  .rij .ic.ok { background: var(--good-soft); color: var(--good); }
  .rij .ic.let { background: var(--sun-soft); color: var(--sun-ink); }
  .rij b { font-weight: 650; display: block; overflow-wrap: anywhere; }
  .rij .sub { font-size: 13px; color: var(--ink-2); display: block; }
  .rij .act { justify-self: end; }
  .rij a.act { color: var(--ink-2); font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px; }
  .zoek .zrij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .zoek .zrij #zTekst { flex: 1; min-width: 180px; }
  .card h2.t { margin: 0 0 6px; }
  details.zonder > summary { list-style: none; cursor: pointer; display: grid; gap: 2px; }
  details.zonder > summary::-webkit-details-marker { display: none; }
  details.zonder > summary h2 { display: flex; justify-content: space-between; align-items: center; }
  details.zonder > summary h2::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); margin-right: 6px; transition: transform .2s; }
  details.zonder[open] > summary h2::after { transform: rotate(-135deg); }
  .leeg { color: var(--ink-2); font-size: 14px; margin: 0; }
  .kies { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
  .kies button { font: inherit; font-weight: 600; padding: 14px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); cursor: pointer; }
  .kies button.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }

  /* ===== 0.76: Apparaten als rustige lijsten ===== */
  main { max-width: 720px; }
  .kop { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 18px; }
  .kop h1 { margin: 0 0 6px !important; }
  .zoekregel { margin: 0; color: var(--ink-2); font-size: 14.5px; display: block; }
  .zoekregel .spin { display: inline-block; vertical-align: -2px; margin-right: 6px !important; }
  .zoekregel .spin { margin: 0; width: 15px; height: 15px; flex: none; }
  .zoekregel #zTekst { flex: 0 1 auto; min-width: 0; }
  .linkknop { font: inherit; font-weight: 650; color: var(--ink); background: none; border: 0; padding: 6px 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; min-height: 32px; }
  .btn.plus { flex: none; gap: 6px; padding: 11px 18px 11px 14px; }
  .btn.plus svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  @media (max-width: 520px) { .btn.plus { display: none; } }
  main { display: flex; flex-direction: column; }
  main > * { order: 2; } main > .top, main > .kop { order: 0; } .gevonden, #meterKaart { order: 1 !important; } .groep.eerst { order: 1 !important; }
  #beheerGroep, .ook { order: 3 !important; }
  .groep { margin: 0 0 22px; }
  .groep > h2 { font: 650 17px/1.3 "Inter Tight", Inter, sans-serif; letter-spacing: -.01em; margin: 0 4px 8px; }
  .groep-uitleg { margin: -4px 4px 10px; font-size: 14px; color: var(--ink-2); }
  .lijst { background: var(--card-solid); border-radius: 20px; box-shadow: 0 0 0 1px var(--line), var(--zs-schaduw, var(--shadow)); overflow: hidden; }
  .lijst .rij, .lijst .rij-uit > summary, .lijst .rij-uit.knop { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 14px; align-items: center;
    padding: 13px 16px; border: 0; border-top: 1px solid var(--line); min-height: 64px; text-decoration: none; color: inherit; width: 100%; text-align: left;
    font: inherit; background: none; }
  .lijst > :first-child, .lijst > :first-child > summary { border-top: 0 !important; }
  .lijst .rij-uit { border-top: 1px solid var(--line); } .lijst .rij-uit > summary { border-top: 0; list-style: none; cursor: pointer; }
  .lijst .rij-uit > summary::-webkit-details-marker { display: none; }
  .lijst .rij-uit.knop { cursor: pointer; }
  .lijst .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); color: var(--ink-2); }
  .lijst .ic svg { width: 21px; height: 21px; }
  .lijst b { font-weight: 650; display: block; overflow-wrap: anywhere; }
  .lijst .sub { font-size: 13.5px; color: var(--ink-2); display: block; line-height: 1.4; }
  .lijst .let-op { font-style: normal; font-weight: 650; color: var(--warn); }
  a.rij.link:hover b, button.rij.link:hover b, .rij-uit > summary:hover b, .rij-uit.knop:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .rij.link, .rij-uit.knop { cursor: pointer; }
  .pijl, .rij-uit > summary::after, .rij-uit.knop::after { width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-top: 2px solid var(--ink-3); transform: rotate(45deg); margin-right: 4px; }
  .rij-uit > summary::after { content: ""; transform: rotate(135deg); transition: transform .18s; } .rij-uit[open] > summary::after { transform: rotate(-45deg); }
  .rij-uit.knop::after { content: ""; }
  .rij-uit #state { padding: 0 16px 16px 70px; }
  @media (max-width: 520px) { .rij-uit #state { padding-left: 16px; } }
  .plusrij .ic { background: var(--ink); color: var(--card-solid); }
  .plusrij b { color: var(--ink); }
  .gevonden .lijst { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--sun) 55%, transparent), var(--zs-schaduw, var(--shadow)); }
  .gevonden .ic { background: var(--sun-soft); color: var(--sun-ink); }
  .ook { margin: -8px 6px 22px; }
  /* het toevoegblad: over de hele pagina, op de telefoon van onder naar boven */
  body.blad-open { overflow: hidden; }
  .blad { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 16, .42); display: flex; align-items: flex-end; justify-content: center; }
  .blad-in { background: var(--bg); width: min(720px, 100%); height: min(92vh, 100%); overflow-y: auto; overscroll-behavior: contain;
    border-radius: 24px 24px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.4);
    animation: blad .22s ease-out; }
  @keyframes blad { from { transform: translateY(24px); opacity: .6; } }
  @media (min-width: 760px) { .blad { align-items: center; } .blad-in { border-radius: 24px; height: min(86vh, 900px); padding: 0 24px 24px; } }
  .blad-kop { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px;
    padding: 14px 0 10px; background: var(--bg); }
  .blad-kop h2 { margin: 0; text-align: center; font-size: 18px; }
  .terugknop, .sluitknop { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .sluitknop { grid-column: 3; } .terugknop[hidden] + h2 { grid-column: 2; }
  .terugknop svg, .sluitknop svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .blad-vraag { margin: 6px 2px 10px; font-weight: 650; }
  .tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .tegels button { font: inherit; font-weight: 650; font-size: 15px; display: grid; gap: 10px; justify-items: start; text-align: left; padding: 14px; border-radius: 18px; border: 0;
    background: var(--card-solid); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 1px var(--line); min-height: 104px; align-content: space-between; }
  .tegels button:hover { box-shadow: 0 0 0 1.5px var(--ink); }
  .tegels .ti { width: 40px; height: 40px; border-radius: 12px; background: var(--chip); display: grid; place-items: center; color: var(--ink-2); }
  .tegels .ti svg { width: 22px; height: 22px; }
  .zoekveld { margin: 0 0 6px; }
  .count { margin: 8px 4px; }
  details.brandrow { border-radius: 16px; border: 0; box-shadow: 0 0 0 1px var(--line); }
  details.brandrow[open] { box-shadow: 0 0 0 1.5px var(--ink); }
  details.brandrow summary { min-height: 60px; }
  .routes { border-top: 1px solid var(--line); }
  .route .rt { font-weight: 650; }
  details.anders > summary { font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; padding: 10px 0 4px; }
  .panel { z-index: 70; }

  /* ===== 0.76b: apparaten volgens het ontwerp ===== */
  .kop { align-items: center; }
  .kop > div { flex: 1; min-width: 0; }
  .tandwiel { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); flex: none; }
  .tandwiel svg { width: 25px; height: 25px; } .tandwiel:hover { background: var(--chip); }
  .lijst .app-rij { min-height: 76px; }
  .lijst .ic.vol { width: 48px; height: 48px; border-radius: 14px; color: #fff; }
  .lijst .ic.vol svg { width: 26px; height: 26px; }
  .lijst .app-rij, .lijst .plusrij { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .ic.paars { background: linear-gradient(145deg, #6d28d9, #a78bfa); } .ic.blauw { background: linear-gradient(145deg, #1d4ed8, #60a5fa); }
  .ic.groen { background: linear-gradient(145deg, #047857, #34d399); } .ic.indigo { background: linear-gradient(145deg, #1e3a8a, #3b82f6); }
  .ic.amber { background: linear-gradient(145deg, #c2410c, #fb923c); }
  .ic.grijs { background: linear-gradient(145deg, #334155, #94a3b8); }
  .app-rij b { display: flex !important; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lbl { font: 700 11.5px/1 Inter, sans-serif; font-style: normal; padding: 5px 8px; border-radius: 99px; background: var(--chip); color: var(--ink-2); }
  .lbl.groen { background: color-mix(in srgb, var(--zs-groen, #16a34a) 18%, transparent); color: var(--zs-groen, #16a34a); }
  .lbl.amber { background: color-mix(in srgb, var(--zs-amber, #d97706) 18%, transparent); color: var(--zs-amber, #d97706); }
  .lbl.rood { background: color-mix(in srgb, #f87171 18%, transparent); color: #f87171; }
  .app-rij .sub { display: flex !important; gap: 14px; margin-top: 3px; }
  .app-rij .kw { font: 700 15.5px/1.3 "Inter Tight", Inter, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  .lijst .plusrij .ic { width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, var(--zs-knop, #2f7cf6) 18%, transparent); color: var(--zs-knop, #2f7cf6); }
  .lijst { background: var(--zs-kaart, var(--card-solid)); }
  /* 0.81: toevoegen in drie stappen */
  .merktegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .merktegel { font: inherit; text-align: left; display: grid; gap: 4px; align-content: start; padding: 14px; min-height: 84px; border-radius: 18px; border: 0; cursor: pointer;
    background: var(--zs-kaart, var(--card-solid)); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

<script>
// Fouten in dit scherm melden aan Zonnestuur (die filtert en ontdubbelt); netwerkhaperingen tellen niet mee.
window.zsFout = (function () { let n = 0; return function (msg, where) {
  msg = String((msg && msg.message) || msg || ""); if (!msg || n++ > 5 || /Failed to fetch|NetworkError|Load failed|AbortError|HTTP 5\d\d|ResizeObserver/i.test(msg)) return;
  let t = ""; try { t = localStorage.getItem("zs_token") || ""; } catch (e) {}
  try { fetch("api/fout", { method: "POST", headers: { "Content-Type": "application/json", "X-Token": t }, body: JSON.stringify({ msg: msg.slice(0, 500), where: (String(where || "") + "\n" + location.pathname).slice(0, 3000) }) }).catch(() => {}); } catch (e) {}
}; })();
addEventListener("error", (e) => zsFout(e.message, (e.error && e.error.stack) || `${e.filename}:${e.lineno}:${e.colno}`));
addEventListener("unhandledrejection", (e) => zsFout(e.reason, e.reason && e.reason.stack));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = ""; try { token = localStorage.getItem("zs_token") || ""; } catch (e) {}
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Token": token, "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { const t = window.prompt ? prompt("Wachtwoord voor Zonnestuur") : ""; token = t || ""; try { localStorage.setItem("zs_token", token); } catch (e) {} return api(path, opts); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Er ging iets mis (" + r.status + ")");
  if (d.type === "error") throw new Error(d.error);
  return d;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let LIST = [], OV = {}, CAT = "", LIMIT = 40, GEVONDEN = [];
// wat de laatste netwerkscan vond (voor het invullen van een IP-adres)
let NETMERKEN = [], ROUTER = {};
function matterBlok() {
  const wacht = NETMERKEN.filter((m) => m.merk === "Matter");
  if (!wacht.length) return "";               // alleen tonen als er echt een Matter-apparaat wacht (de knop staat ook onderaan)
  const soorten = [...new Set(wacht.map((m) => (m.categorie || "apparaat").toLowerCase()))].join(", ");
  return `<div class="ontdekt" id="matterKaart"><b>Er wacht een Matter-apparaat op koppelen (${esc(soorten)})</b>
    <p class="small muted" style="margin:2px 0 8px">Scan de QR-code op het apparaat, dan koppelt Zonnestuur het meteen.</p>
    <button class="btn small" type="button" id="matterGo">QR-code scannen</button></div>`;
}
function scanLaden() {
  return api("api/setup/scan").then((r) => { GEVONDEN = (r.found || []).filter((g) => g.host && /^\d+\.\d+\.\d+\.\d+$/.test(g.host));
    NETMERKEN = (r.merken || []).filter((m) => m.merk && m.zeker); ROUTER = r.router || {};
    if ((NETMERKEN.length || ROUTER.soort) && OV && Object.keys(OV).length) stateCard(); return r; }).catch(() => {});
}
scanLaden();
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-ip]"); if (!a) return;
  e.preventDefault(); const inp = a.closest(".field").querySelector("input"); if (inp) inp.value = a.dataset.ip;
});
const ZS_LINK = {
  inverter: ["sunspec", "fronius", "sma", "solaredge", "huawei", "goodwe", "sungrow", "kostal", "opendtu", "ahoydtu", "apsystems", "enphase", "solax", "victron"],
};
function zsLink(key) {
  if (ZS_LINK.inverter.includes(key)) return `instellingen?omvormer=${key}&onderdeel=feedCard`;
  if (key === "laadpaal") return "setup#toevoegen";
  if (key.startsWith("bat_")) return `instellingen?batterij=${key.slice(4)}&onderdeel=batCard`;
  if (["p1_serial", "homewizard_p1", "shelly_em", "youless", "dsmr_reader", "esphome_p1", "mqtt_meter", "homey_meter"].includes(key)) return "instellingen#editCard";
  if (["shelly", "shelly_gen1", "homewizard_socket", "tasmota", "esphome"].includes(key)) return "setup#toevoegen";
  if (["domoticz", "openhab", "iobroker"].includes(key)) return "instellingen#sysCard";
  if (key === "alfen" || key === "sprsun") return `instellingen?toevoegen=${key}&onderdeel=addCard`;
  return "instellingen#addCard";
}
function routeInfo(r, row) {
  const [k, arg] = [r.route.split(":")[0], r.route.split(":").slice(1).join(":")];
  const t = {
    zonnestuur: ["Rechtstreeks met Zonnestuur", "direct"], ha: ["Via de koppelmotor", "motor"],
    hacs: ["Via een extra koppeling (Zonnestuur installeert die)", "motor"], matter: ["Matter", "motor"], zigbee: ["Zigbee", "motor"],
    evcc: [`Via evcc (${arg})`, "motor"], enode: ["Via de cloud (Enode)", "cloud"], relais: ["Met een relais of slimme stekker", ""],
    meten: ["Meten met een slimme stekker", ""],
  }[k] || [r.route, ""];
  if (r.route === "zonnestuur:laadpaal") return { kind: k, arg, label: "Met de laadpaal, zonder de auto uit te lezen", cls: "direct" };
  if (r.handmatig) return { kind: k, arg, label: "Nog niet met een knop", cls: "" };
  return { kind: k, arg, label: t[0], cls: t[1] };
}
// Enode (betaald) alleen als je zelf een Enode-account hebt ingevuld; anders de gratis routes.
const ENODE_DOET = { vehicle: "accupercentage uitlezen en laden starten en stoppen", charger: "laden starten en stoppen", hvac: "aan, uit en temperatuur",
  battery: "laden en ontladen", inverter: "opwek uitlezen" };
function routesOf(r) {
  const extra = OV.enode ? (r.enode || []).map((k) => ({ route: "enode:" + k, zeker: true, sturen: ENODE_DOET[k] || "",
    nodig: "Je eigen Enode-account (Instellingen → Auto's en laadpalen via de cloud)" })) : [];
  return [...(r.routes || []), ...extra];
}
const PILL = { "met de laadpaal": ["Met de laadpaal", "direct"], "rechtstreeks": ["Rechtstreeks", "direct"], "via de koppelmotor": ["Koppelbaar", "motor"], "via de cloud (Enode)": ["Via de cloud", "cloud"], "met stekker of relais": ["Met stekker", ""], "met hulp": ["Met hulp", ""] };

function connected(r) {
  const i = routeInfo(r);
  if (i.kind === "ha") return (OV.domains || []).includes(i.arg);
  if (i.kind === "hacs") { const c = (OV.custom || {})[i.arg]; const dom = r.domein || (c && c.domain); return !!dom && (OV.domains || []).includes(dom); }
  if (i.kind === "matter") return (OV.domains || []).includes("matter");
  if (i.kind === "zigbee") return (OV.domains || []).includes("zha");
  return false;
}

function stateCard() {
  const m = OV.motor, el = $("state");
  let dot = "ok", txt = "";
  const nGebr = (OV.entries || []).filter((e) => e.soort === "gebruikt").length;
  const telling = `Zonnestuur gebruikt er ${nGebr} van de ${(OV.entries || []).filter((e) => e.soort !== "systeem").length} gekoppelde merken.`;
  if (OV.mode === "motor") txt = `Koppelmotor draait in de Box. ${telling}`;
  else if (OV.mode === "addon") txt = `Koppelmotor actief. ${telling}`;
  else if (OV.mode === "ha") txt = `Gekoppeld met je eigen koppelmotor. ${telling}`;
  else if (m && m.present) { dot = "wait"; txt = "De koppelmotor in de Box start op (de eerste keer duurt dat een paar minuten). Rechtstreekse koppelingen werken al."; }
  else { dot = "wait"; txt = "Rechtstreekse koppelingen werken. Voor de andere merken is de koppelmotor nodig: die zit in de Zonnestuur Box."; }
  const ents = (OV.entries || []).filter((e) => e.soort !== "systeem" && !["matter", "otbr", "thread", "sun", "met", "radio_browser", "google_translate", "shopping_list", "go2rtc", "backup"].includes(e.domain));
  const dongles = (m && m.dongles) || [];
  const NETJES = { esphome: "ESPHome", homewizard: "HomeWizard", shelly: "Shelly", zha: "Zigbee", matter: "Matter", mqtt: "MQTT", tasmota: "Tasmota",
    tuya: "Tuya", knx: "KNX", modbus: "Modbus", ocpp: "Laadpaal (OCPP)", bluetooth: "Bluetooth" };
  const merkVan = (d) => {           // alleen een merknaam als de koppeling bij precies één merk hoort (esphome is van veel merken)
    if (NETJES[d.domain]) return NETJES[d.domain];
    const rs = LIST.filter((x) => routesOf(x).some((rt) => rt.route === "ha:" + d.domain || rt.domein === d.domain));
    const namen = [...new Set(rs.map((x) => x.merk))];
    if (namen.length === 1) return namen[0];
    return d.domain.split("_").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  };
  const ontAlle = OV.ontdekt || [];
  const ont = ontAlle.filter((d) => d.nuttig !== false);
  const ontRest = ontAlle.filter((d) => d.nuttig === false);
  // Merken die Zonnestuur zelf in het netwerk herkende en die nog niet gekoppeld zijn (ook cloud-merken: dan inloggen)
  const al = new Set([...ents.map((e) => merkVan(e)), ...ont.map((d) => merkVan(d))].map((x) => String(x).toLowerCase()));

let FLOW = null, BRAND = "";
// ---- Matter: QR-code scannen (foto; werkt ook zonder https) of de cijfers intikken
function jsqrLaden() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, fout) => { const sc = document.createElement("script"); sc.src = "jsqr.js"; sc.onload = ok; sc.onerror = fout; document.head.appendChild(sc); });
}
async function qrUitFoto(bestand) {
  const img = await createImageBitmap(bestand);
  if ("BarcodeDetector" in window) {
    try { const r = await new window.BarcodeDetector({ formats: ["qr_code"] }).detect(img); if (r[0]) return r[0].rawValue; } catch (e) {}
  }
  await jsqrLaden();
  for (const max of [1400, 900, 2000]) {                 // verschillende maten: kleine QR-codes op een grote foto
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height);
    const r = window.jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (r && r.data) return r.data;
  }
  return "";
}

async function go(row, rt) {
  const info = routeInfo(rt, row);
  BRAND = row.merk;
  try {
    // Al gekoppeld: niet opnieuw inloggen, meteen de apparaten van dit merk laten kiezen
    if ((info.kind === "ha" || info.kind === "hacs") && connected(rt)) {
      const dom = info.kind === "ha" ? rt.route.slice(3) : (rt.domein || ((OV.custom || {})[info.arg] || {}).domain || "");
      if (dom) return apparaatKeuze(row.merk, { domain: dom }, "Dit merk is al gekoppeld.");
    }
    if (info.kind === "ha") { showStep(await starten(row.merk, rt.route)); return; }
    if (info.kind === "hacs") {
      const have = (OV.custom || {})[info.arg];
      if (have) { showStep(await starten(row.merk, "ha:" + have.domain)); return; }
      panel(row.merk, `<p>Hiervoor installeert Zonnestuur een extra koppeling (<b>${esc(info.arg)}</b>) en herstart de koppelmotor. Dat duurt 1 tot 3 minuten (op een Raspberry Pi soms wat langer).</p><p class="small muted">Nodig: ${esc(rt.nodig || "niets extra")}</p>`,
        [["Annuleren", closePanel, "ghost"], ["Installeren en koppelen", async () => {
          try { const r = await post("api/koppel/start", { route: rt.route }); const res = await job(r.job, row.merk);
            showStep(await starten(row.merk, "ha:" + res.domain)); }
          catch (e) { $("p_err").textContent = e.message; }
        }]]);
      return;
    }
    if (info.kind === "matter") { matterPaneel(row.merk, rt.nodig); return; }
    if (info.kind === "zigbee") {
      const r = await post("api/koppel/start", { route: "zigbee" });
      if (r.type === "permit") { panel(`${row.merk} via Zigbee`, `<p>${esc(r.description)}</p><p class="small muted">Nodig: ${esc(rt.nodig || "")}</p>`, [["Klaar", () => done(row.merk)]]); return; }
      showStep(r); return;
    }
    if (info.kind === "evcc") return evccForm(row, rt, info);
    if (info.kind === "enode") {
      panel(`${row.merk} via de cloud`, `<p>Zonnestuur gebruikt hiervoor Enode, een dienst die met veel merken officieel mag praten. Je logt in bij ${esc(row.merk)} en geeft toestemming.</p><p class="small muted">Nodig: ${esc(rt.nodig || "")}</p>`,
        [["Annuleren", closePanel, "ghost"], ["Inloggen bij " + row.merk, async () => {
          try { const r = await post("api/koppel/start", { route: rt.route, vendor: "" }); openUrl(r.url); enodeChoose(info.arg, row.merk); }
          catch (e) { $("p_err").textContent = e.message; }
        }]]);
    }
  } catch (e) { alertPanel(e.message); }
}

// Koppeling starten: kan op een Raspberry Pi even duren (de koppelmotor zet hem op de achtergrond klaar). Laat zien dat hij bezig is.
async function starten(title, route, tweede) {
  const tekst = ["Koppeling starten…", "De koppelmotor zet deze koppeling op de achtergrond klaar. Op een Raspberry Pi kan dat een paar minuten duren.",
    "Nog even geduld: hij is nog bezig. Laat dit scherm open, het formulier verschijnt vanzelf."];
  let i = 0, t0 = Date.now();
  const toon = () => panel(title, `<p><span class="spin"></span>${esc(tekst[i])}</p>${i ? `<p class="small muted">${Math.round((Date.now() - t0) / 1000)} seconden bezig</p>` : ""}`);
  toon();
  const tik = setInterval(() => { const s = (Date.now() - t0) / 1000; i = s > 45 ? 2 : s > 6 ? 1 : 0; toon(); }, 1000);
  let r;
  try { r = await post("api/koppel/start", { route }); } finally { clearInterval(tik); }
  if (r && r.type === "job" && r.job) {
    if (tweede) throw new Error("De koppelmotor kent deze koppeling nog steeds niet. Probeer het later nog eens of meld het probleem.");
    // de koppelmotor moet hem nog leren kennen: herstarten op de achtergrond
    await job(r.job, title);
    return starten(title, route, true);
  }
  return r;
}
// Achtergrond: het scherm gaat dicht en blijft dicht; zodra het klaar is (of misgaat) komt het vanzelf terug.
async function job(id, title) {
  let weg = false;
  for (;;) {
    const j = await api("api/koppel/job/" + id);
    if (j.status === "klaar") return j.result || {};
    if (j.status === "fout") throw new Error(j.error);
    if (!weg) panel(title, `<p><span class="spin"></span>${esc(j.step || "Bezig…")}</p><p class="small muted">Je kunt dit scherm dichtdoen: het gaat op de achtergrond door en het scherm komt terug zodra het klaar is.</p>`,
      [["Op de achtergrond laten doorgaan", () => { weg = true; $("panel").hidden = true; }, "ghost"]]);
    await sleep(2500);
  }
}
// Na het koppelen: geeft deze koppeling een meter door (Tibber Pulse, Zonneplan, Toon…)? Dan meteen aanbieden.
async function gekoppeld(r) {
  const title = BRAND || r.title || "Gekoppeld";
  panel(title, `<p class="ok">Gekoppeld.</p><p><span class="spin"></span>Even kijken wat deze koppeling doorgeeft…</p>`, []);
  let v = { meters: [] };
  for (let i = 0; i < 6 && !v.meters.length && !(OV && OV.heeft_meter); i++) {
    try { v = await post("api/koppel/meter-voorstel", { entry_id: r.entry_id || "", domain: r.domain || "" }); } catch (e) { break; }
    if (!v.meters.length) await sleep(4000);
  }
  if (!v.meters.length) return apparaatKeuze(title, r, "Gekoppeld.");
  const m = v.meters[0], w = Number(m.state);
  const nu = isFinite(w) && m.state !== "" ? ` Nu: <b>${Math.round(m.unit === "kW" ? w * 1000 : w)} W</b>.` : "";
  panel(title, `<p class="ok">Gekoppeld.</p><p>Hiermee ziet Zonnestuur je <b>stroomverbruik en teruglevering</b> live (${esc(m.name)}).${nu}</p>
    ${v.huidig ? `<p class="small muted">Je gebruikt nu al een andere meter. Kies deze alleen als je wilt overstappen.</p>` : ""}`,
    [["Niet nu", () => apparaatKeuze(title, r, "Gekoppeld."), "ghost"], ["Gebruik als meter", async () => {
      try { await post("api/koppel/meter", { entity: m.entity, export_entity: m.export_entity || "" });

    }]]);

// Na het koppelen (of als het merk al gekoppeld was): welke apparaten van dit merk zet Zonnestuur aan? Eén tik per apparaat.
async function apparaatKeuze(title, r, kop) {
  FLOW = null;
  panel(title, `<p class="ok">${esc(kop)}</p><p><span class="spin"></span>Even kijken welke apparaten Zonnestuur hiermee kan sturen…</p>`, [["Sluiten", closePanel, "ghost"]]);
  let v = { apparaten: [] };
  let rondes = 4;
  for (let i = 0; i < rondes && !v.apparaten.length && !$("panel").hidden; i++) {
    try { v = await post("api/koppel/apparaat-voorstel", { entry_id: r.entry_id || "", domain: r.domain || "" }); } catch (e) { break; }
    if (v.wacht) {                                  // startknop stond uit: Zonnestuur heeft hem aangezet, even wachten
      rondes = i + 14;
      $("p_body").querySelector("p:last-of-type").innerHTML = `<span class="spin"></span>De startknop van je apparaat staat nog uit. Zonnestuur zet hem aan, dat duurt ongeveer een halve minuut…`;
    }

function fieldHtml(f, err) {

// Eerst wat echt nodig is; optionele velden (met een goede standaard) ingeklapt, zodat het scherm kort blijft
function velden(fields, errs) {
  const nodig = fields.filter((f) => f.required || errs[f.name]), rest = fields.filter((f) => !(f.required || errs[f.name]));

    if (f.kind === "boolean") out[f.name] = el.checked;

    else if (f.kind === "select") { const o = (f.options || []).find(([ov]) => String(ov) === el.value); out[f.name] = o ? o[0] : el.value; }

}

async function poll(r) {

  const m = v.meters[0], w = Number(m.state);
  k.innerHTML = `<h2 class="t" style="margin:0 0 6px">Je meter is gevonden</h2>
    <p class="small" style="margin:0">${esc(m.name)}${isFinite(w) && m.state !== "" ? ` · nu ${Math.round(m.unit === "kW" ? w * 1000 : w)} W` : ""}. Gebruik hem als meter, dan ziet Zonnestuur je verbruik en teruglevering live.</p>
    <div class="acts" style="margin-top:12px"><button class="btn" type="button" id="meterJa">Gebruik als meter</button></div>`;
  k.hidden = false;
  $("meterJa").onclick = async () => {
    try { await post("api/koppel/meter", { entity: m.entity, export_entity: m.export_entity || "" });
      k.innerHTML = `<p class="ok" style="margin:0">Klaar: dit is nu je meter. <a href="./">Naar het dashboard</a></p>`; }
    catch (e) { k.insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`); }
  };
}
(async () => {
  try { LIST = await (await fetch("koppellijst.json")).json(); } catch (e) { LIST = []; }
  const cats = [...new Set(LIST.map((r) => r.categorie))].sort();
  $("cats").innerHTML = `<button class="on" data-c="">Alles</button>` + cats.map((c) => `<button data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("cats").querySelectorAll("button").forEach((b) => b.onclick = () => { CAT = b.dataset.c; LIMIT = 40; $("cats").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); render(); });
  $("q").oninput = () => { LIMIT = 40; MERK = null; if (!CAT) $("t_terug").hidden = !$("q").value.trim(); render(); };
  $("more").onclick = () => { LIMIT += 60; render(); };
  $("matterAltijd").onclick = () => matterPaneel("", "");
  const qp = new URLSearchParams(location.search); if (qp.get("q")) $("q").value = qp.get("q");
  if (qp.get("cat") && cats.includes(qp.get("cat"))) {      // vanuit 'Gezien aan je meter': meteen de goede soort
    CAT = qp.get("cat"); $("cats").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.c === CAT));
  }
  render();
  $("zoekNu").onclick = () => huisLaden("nu");
  $("soortKies").querySelectorAll("[data-cat]").forEach((b) => {
    b.querySelector(".ti").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[b.dataset.ic] || IC.generic}</svg>`;
    b.onclick = () => { if (b.dataset.cat) kiesSoort(b.dataset.cat, b.textContent.trim()); else { $("q").focus(); } };
  });
  $("toevoegKnop").onclick = () => openToevoegen("");
  $("t_dicht").onclick = sluitToevoegen;
  $("t_terug").onclick = () => { if (BLAD === "form" && MERK) { BLAD = null; render(); } else if (MERK) { BLAD = null; sluitMerk(); } else { BLAD = null; $("q").value = ""; kiesSoort("", ""); } };
  $("anderMerk").addEventListener("keydown", (e) => { if (e.key === "Escape" && $("panel").hidden) sluitToevoegen(); });
  if (qp.get("q") || qp.get("cat")) openToevoegen(CAT);
  if (location.hash === "#toevoegen") openToevoegen("");
  if (qp.get("q")) { const rs = rijen(), q = qp.get("q").toLowerCase(); const r = rs.find((x) => x.merk.toLowerCase() === q) || (rs.length === 1 ? rs[0] : null); if (r) openMerk(r); }   // vanuit het eerste instellen: meteen dat merk
  await load();
  let later = false; try { later = sessionStorage.getItem("zs_start_later") === "1"; } catch (e) {}
  if (!later) startKaart();
  huisLaden(true);
  // nieuwe vondsten van de koppelmotor (en een motor die nog opstart) vanzelf bijwerken
  setInterval(() => { if ($("panel").hidden && !document.hidden) { load(); huisLaden(false); } }, 30000);
  const m = location.hash.match(/^#enode-(\w+)/); if (m) enodeChoose(m[1]);
})();
