<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Wat Zonnestuur weet</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Inter Tight"; src: url("fonts/inter-tight.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; color: var(--zs-ink); font: 15.5px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 120px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 2px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; color: inherit; }
  .terug { color: var(--zs-ink2); text-decoration: none; font-weight: 600; font-size: 14.5px; display: inline-block; padding: 4px 2px; }
  h1 { font: 760 clamp(30px, 6vw, 40px)/1.05 "Inter Tight", Inter, sans-serif; letter-spacing: -.03em; margin: 6px 2px 8px; }
  .intro { color: var(--zs-ink2); margin: 0 2px 18px; max-width: 60ch; }
  .lijst { background: var(--zs-kaart, var(--zs-vlak)); border-radius: 22px; box-shadow: 0 0 0 1px var(--zs-lijn); overflow: hidden; }
  .item { padding: 16px 18px; border-top: 1px solid var(--zs-lijn); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; }
  .item:first-child { border-top: 0; }
  .item h2 { font: 680 17px/1.3 "Inter Tight", Inter, sans-serif; margin: 0; }
  .item p { margin: 0; grid-column: 1 / -1; font-size: 14.5px; }
  .item .wat { color: var(--zs-ink); font-size: 15px; }
  .item .bron, .item .uitleg { color: var(--zs-ink2); }
  .zeker { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; align-self: start; white-space: nowrap; }
  .zeker.hoog { background: color-mix(in srgb, #34d399 18%, transparent); color: #6ee7b7; }
  .zeker.redelijk { background: color-mix(in srgb, #60a5fa 18%, transparent); color: #93c5fd; }
  .zeker.laag { background: color-mix(in srgb, #fbbf24 16%, transparent); color: #fcd34d; }
  [data-theme="light"] .zeker.hoog { color: #047857; } [data-theme="light"] .zeker.redelijk { color: #1d4ed8; } [data-theme="light"] .zeker.laag { color: #92400e; }
  .voorsp { background: var(--zs-zacht); padding: 8px 12px; border-radius: 12px; }
  .acties { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; grid-column: 1 / -1; }
  .btn { font: inherit; font-weight: 650; font-size: 14px; border: 0; cursor: pointer; padding: 9px 14px; border-radius: 999px; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; }
  .veilig { margin: 16px 4px; color: var(--zs-ink2); font-size: 14px; }
  .melding { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--zs-vlak); color: var(--zs-ink);
    padding: 10px 16px; border-radius: 99px; box-shadow: 0 0 0 1px var(--zs-lijn), 0 12px 30px -12px rgba(0,0,0,.6); font-weight: 600; font-size: 14px; z-index: 60; }
</style>
<link rel="stylesheet" href="stijl.css">
</head>
<body>
<main>
  <header class="top"><a class="brand" href="./"><img src="zon.svg" alt="" width="28" height="28">Zonnestuur</a></header>
  <a class="terug" href="inzicht">← Inzichten</a>
  <h1>Wat Zonnestuur weet</h1>
  <p class="intro">Alles wat Zonnestuur over je huis geleerd heeft, waar het op gebaseerd is en hoe zeker het is. Klopt iets niet meer, bijvoorbeeld na een verbouwing of een nieuwe batterij? Laat dat onderdeel vergeten, dan begint Zonnestuur daar opnieuw.</p>
  <div class="lijst" id="lijst"><div class="item"><p>Laden…</p></div></div>
  <p class="veilig" id="veilig"></p>
</main>
<p class="melding" id="melding" role="status" hidden></p>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = ""; try { token = localStorage.getItem("zs_token") || ""; } catch (e) {}
async function api(p, o = {}) {
  o.headers = Object.assign({ "X-Token": token, "Content-Type": "application/json" }, o.headers || {});
  const r = await fetch(p, o);
  if (r.status === 401) { token = prompt("Wachtwoord voor Zonnestuur") || ""; try { localStorage.setItem("zs_token", token); } catch (e) {} return api(p, o); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || "Dat lukte niet (" + r.status + ")");
  return d;
}
let mt = null;
function melding(t) { const m = $("melding"); m.textContent = t; m.hidden = false; clearTimeout(mt); mt = setTimeout(() => { m.hidden = true; }, 2600); }
const ZEKER = { hoog: "Zeker", redelijk: "Redelijk zeker", laag: "Nog onzeker" };
async function laad() {
  let d;
  try { d = await api("api/brein"); } catch (e) { $("lijst").innerHTML = `<div class="item"><p>${esc(e.message)}</p></div>`; return; }
  $("veilig").textContent = d.veilig || "";
  $("lijst").innerHTML = (d.items || []).map((x) => `<div class="item">
    <h2>${esc(x.naam)}</h2><span class="zeker ${esc(x.zeker)}">${ZEKER[x.zeker] || ""}</span>
    <p class="wat">${esc(x.wat)}</p>
    <p class="bron">Gebaseerd op: ${esc(x.gegevens)}</p>
    ${x.voorspelling ? `<p class="voorsp">${esc(x.voorspelling.tekst)}</p>` : ""}
    ${x.uitleg ? `<p class="uitleg">${esc(x.uitleg)}</p>` : ""}
    ${x.vergeet || x.link ? `<div class="acties">${x.link ? `<a class="btn ghost" href="${esc(x.link)}">Bekijken</a>` : ""}${x.vergeet ? `<button class="btn ghost" type="button" data-vergeet="${esc(x.id)}" data-naam="${esc(x.naam)}">Vergeten en opnieuw leren</button>` : ""}</div>` : ""}
  </div>`).join("") || `<div class="item"><p>Zonnestuur heeft nog niets geleerd. Over een paar dagen staat hier wat hij van je huis weet.</p></div>`;
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-vergeet]");
  if (!b) return;
  if (!confirm(`${b.dataset.naam}: alles wat Zonnestuur hierover leerde wissen en opnieuw beginnen?`)) return;
  try { await api("api/brein/vergeet", { method: "POST", body: JSON.stringify({ wat: b.dataset.vergeet }) }); melding("Vergeten. Zonnestuur leert het opnieuw."); laad(); }
  catch (e) { melding(e.message); }
});
laad();
</script>
</body>
</html>
